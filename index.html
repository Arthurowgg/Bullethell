<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#08070f" />
<title>MARVEL NEXUS — Bullet Hell</title>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="icon" href="assets/favicon.png" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="640" height="360" tabindex="0" aria-label="MARVEL NEXUS"></canvas>
    <div id="boot">
      <div class="boot-frame">
        <img id="boot-loki" src="assets/sprites/ui/loki_ugly.png" alt="" />
        <div class="boot-head">
          <img id="boot-logo" src="assets/sprites/ui/nexus_logo.png" alt="MARVEL NEXUS" />
          <div class="boot-sub">BULLET HELL DIMENSIONAL</div>
        </div>
        <div class="boot-bar"><i id="boot-fill"></i><span class="boot-seg"></span></div>
        <div class="boot-row"><div class="boot-hint" id="boot-hint">INICIALIZANDO O NEXUS...</div><div class="boot-pct" id="boot-pct">0%</div></div>
        <div class="boot-err" id="boot-err"></div>
      </div>
    </div>
  </div>
  <noscript><div style="color:#fff;font-family:monospace;padding:24px">MARVEL NEXUS precisa de JavaScript.</div></noscript>
  <script type="module" src="js/main.js?v=6"></script>
</body>
</html>
